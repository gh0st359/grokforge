[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grokforge-agents"
version = "0.1.0"
description = "grokforge agents — Grok-powered specialists for autonomous software engineering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "grokforge contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "tiktoken>=0.6",
    "z3-solver>=4.13",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["grokforge_agents*"]

[tool.setuptools.package-data]
grokforge_agents = ["templates/**/*", "templates/**/.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["grokforge_agents/templates", "build", "dist"]
