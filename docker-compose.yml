services:
  core:
    build: ./core
    image: grokforge/core:dev
    container_name: grokforge-core
    ports:
      - "8080:8080"   # REST + SSE
      - "9090:9090"   # Prometheus metrics
    environment:
      RUST_LOG: info
      AGENTS_URL: http://agents:8001
      STATE_DIR: /var/lib/grokforge
    volumes:
      - core_state:/var/lib/grokforge
    depends_on:
      - agents
    restart: unless-stopped

  agents:
    build: ./agents
    image: grokforge/agents:dev
    container_name: grokforge-agents
    ports:
      - "8001:8001"
    environment:
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.x.ai/v1}
      GROK_PRIMARY_MODEL: ${GROK_PRIMARY_MODEL:-grok-4-3}
      GROK_FALLBACK_MODEL: ${GROK_FALLBACK_MODEL:-grok-4-mini}
      MAX_DEBATE_ROUNDS: "4"
      CONFIDENCE_THRESHOLD: "0.95"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: grokforge/frontend:dev
    container_name: grokforge-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CORE_URL: http://localhost:8080
    depends_on:
      - core
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: grokforge-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grokforge-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grokforge
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  core_state:
  grafana_data:
