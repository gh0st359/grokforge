apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: grokforge
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: grokforge-core
        static_configs:
          - targets: ["core:9090"]
      - job_name: grokforge-agents
        metrics_path: /metrics
        static_configs:
          - targets: ["agents:8001"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: grokforge
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/prometheus }
      volumes:
        - name: cfg
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: grokforge
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: grokforge
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: grokforge }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: grokforge
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
