apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: grokforge
  labels: { app: frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: grokforge/frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: CORE_URL, value: http://core:8080 }
            - { name: NEXT_PUBLIC_CORE_URL, value: http://core:8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: grokforge
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 3000 }
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: grokforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"   # SSE
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: grokforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
          - path: /api/core
            pathType: Prefix
            backend: { service: { name: core, port: { number: 8080 } } }
